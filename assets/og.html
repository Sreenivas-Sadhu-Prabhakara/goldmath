<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #241711; --card: #2F1F16; --line: #4A3324;
    --ink: #F2E7D4; --soft: #C9B295;
    --accent: #E06A3C; --accent-deep: #C1552F; --fixed: #6B5136;
    --cream: #FCF7EC;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1100px 560px at 84% -12%, rgba(224,106,60,0.16), transparent 60%),
      radial-gradient(820px 460px at 4% 8%, rgba(193,85,47,0.10), transparent 55%),
      linear-gradient(180deg, #2b1a12 0%, #241711 100%);
  }
  .frame { position: absolute; inset: 0; padding: 76px 90px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand__word { font-size: 62px; font-weight: 800; letter-spacing: -0.04em; }

  /* the debossed hallmark punch */
  .punch {
    width: 176px; height: 176px; border-radius: 30px;
    background: linear-gradient(145deg, #d55d33, #b04a26);
    display: grid; place-items: center;
    box-shadow: inset 0 6px 12px rgba(255,220,190,0.30),
                inset 0 -8px 16px rgba(60,20,8,0.55),
                0 22px 48px -20px rgba(0,0,0,0.7);
    border: 2px solid #8A3B21;
  }
  .punch span {
    font-size: 74px; font-weight: 800; letter-spacing: -0.03em; color: var(--cream);
    text-shadow: 0 2px 2px rgba(60,20,8,0.5), 0 -1px 0 rgba(255,235,215,0.35);
  }

  .headline { max-width: 900px; }
  .headline h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.08; }
  .headline h1 .neg { color: var(--accent); }
  .headline p { margin-top: 22px; font-size: 29px; font-weight: 500; color: var(--soft); max-width: 30ch; line-height: 1.32; }

  /* fixed / negotiable split bar */
  .splitwrap { display: flex; flex-direction: column; gap: 14px; }
  .bar { display: flex; height: 40px; border-radius: 999px; overflow: hidden; border: 2px solid var(--line); }
  .bar .fix { width: 64%; background: linear-gradient(180deg,#7a5c3e,#5f4630); }
  .bar .neg { width: 36%; background: linear-gradient(180deg,#e2703f,#c1552f);
    background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255,255,255,0.18) 8px, rgba(255,255,255,0.18) 14px); }
  .legend { display: flex; gap: 18px; }
  .tag { display: inline-flex; align-items: center; gap: 11px; font-size: 24px; font-weight: 700; padding: 10px 22px; border-radius: 999px; }
  .tag.fix { background: #5f4630; color: var(--cream); }
  .tag.neg { background: var(--accent-deep); color: var(--cream); }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <div class="punch"><span>916</span></div>
      <span class="brand__word">goldmath</span>
    </div>

    <div class="headline">
      <h1>Rebuild the jeweller's quote&nbsp;—<br>see which rupees are <span class="neg">negotiable</span>.</h1>
      <p>Weight, BIS purity, board rate, wastage, making &amp; GST.</p>
    </div>

    <div class="splitwrap">
      <div class="bar"><div class="fix"></div><div class="neg"></div></div>
      <div class="legend">
        <span class="tag fix">◆ Fixed — metal + GST</span>
        <span class="tag neg">◇ Negotiable — making + wastage</span>
      </div>
    </div>
  </div>
</body>
</html>
