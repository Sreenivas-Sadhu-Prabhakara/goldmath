<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #C1552F; }
  body { display: grid; place-items: center; }
  /* 12% safe padding -> punch fills the middle 76vmin */
  .punch {
    width: 76vmin; height: 76vmin; border-radius: 18vmin;
    background: linear-gradient(145deg, #d55d33, #b04a26);
    display: grid; place-items: center;
    box-shadow: inset 0 3vmin 6vmin rgba(255,220,190,0.30),
                inset 0 -4vmin 8vmin rgba(60,20,8,0.55);
    border: 1.2vmin solid #8A3B21;
  }
  .punch span {
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 34vmin; font-weight: 800; letter-spacing: -0.03em; color: #FCF7EC;
    text-shadow: 0 1vmin 1vmin rgba(60,20,8,0.5), 0 -0.5vmin 0 rgba(255,235,215,0.35);
  }
</style>
</head>
<body>
  <div class="punch"><span>916</span></div>
</body>
</html>
